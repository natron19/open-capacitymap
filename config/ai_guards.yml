# Per-app guardrail configuration, read by AiGuardConfig.
# See docs/ai-guardrails.md (Layer 1b: AiOutputGuard) and docs/ai-evals.md.

# Gift inventories describe skills and community context; personal distress is out of scope.
crisis_terms: []

# Output structure rules per AiTemplate name. Templates not listed get the
# generic output checks only (non-empty, no prompt leak, no profanity, no new PII).
#   format:        text | json
#   required_keys: top-level keys the JSON object must contain
templates:
  health_ping:
    format: text
  demo_placeholder_v1:
    format: text
  # GiftInventoriesController#generate does JSON.parse(raw)["projects"].
  # The 5-7 count check stays in the controller.
  capacitymap_projects_v1:
    format: json
    required_keys: [projects]
